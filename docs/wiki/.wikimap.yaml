home: docs/wiki
engine: none
pages:
  # skills/*/SKILL.md is load-bearing here: index.md links one entry per skill,
  # so adding a skill without touching this page leaves the new page unreachable.
  - path: index.md
    documents: [README.md, PUBLISHING.md, IDEAS.md, AGENTS.md, docs/wiki/workflow.md, skills/*/SKILL.md]

  # Two audiences, split in half: installing from skills.sh (documented by the
  # README's install surface) and working on the repo (documented by the scripts).
  # It quotes the skill count in five places, so it depends on the skill set too.
  - path: getting-started.md
    mode: tutorial
    documents: [README.md, Makefile, scripts/lib.sh, scripts/link.sh, scripts/unlink.sh, scripts/list.sh, skills/*/SKILL.md]

  - path: architecture.md
    mode: explanation
    documents:
      - Makefile
      - scripts/**
      - skills/*/SKILL.md
      - .github/workflows/lint.yml
      - .gitignore
      - skills.sh.json
      - AGENTS.md

  - path: reference.md
    mode: reference
    documents:
      - Makefile
      - scripts/**
      - .github/workflows/lint.yml
      - .gitignore
      - AGENTS.md

  - path: how-to/add-a-new-skill.md
    mode: how-to
    documents: [AGENTS.md, scripts/lint.sh, scripts/security.sh, skills.sh.json, README.md, IDEAS.md]

  - path: how-to/recover-a-wedged-dev-link.md
    mode: how-to
    documents: [scripts/lib.sh, scripts/link.sh, scripts/unlink.sh]

  # Generated, never authored: scripts/cheatsheet.sh derives every line from a
  # skill's description, and `make lint` diffs the committed page against a fresh
  # generation. Listed here so a docs audit sweeps it, but the fix for anything
  # wrong on it is always an edit to a SKILL.md plus `make cheatsheet`.
  - path: cheatsheet.md
    mode: reference
    documents: [skills/*/SKILL.md]

  # The composition map: how the skills sequence into one loop. It restates skill
  # facts on purpose so a reader gets one map, which is why `make lint` cross-checks
  # the names, the `<kit> <mode>` invocations, and the label vocabulary it quotes.
  - path: workflow.md
    mode: explanation
    documents: [skills/*/SKILL.md]
